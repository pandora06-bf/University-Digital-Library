name: Keep API awake

# Render gói Free ngủ sau 15 phút không có request; scheduler chạy trong API nên phải giữ nó thức.
# Đặt biến repo API_HEALTH_URL (Settings > Secrets and variables > Actions > Variables),
# vd. https://libmanager-api.onrender.com/health. Chưa đặt thì workflow bỏ qua.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ vars.API_HEALTH_URL != '' }}
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 60 "${{ vars.API_HEALTH_URL }}"
