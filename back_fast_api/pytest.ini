[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=app --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=60

[coverage:run]
source = app
omit =
    app/bootstrap_admin.py
    app/cli.py
    */__pycache__/*

[coverage:report]
show_missing = True
fail_under = 60
