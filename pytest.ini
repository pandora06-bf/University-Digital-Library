[pytest]
testpaths = back_fast_api/tests
pythonpath = back_fast_api
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=app --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=60

[coverage:run]
source = back_fast_api/app
omit =
    back_fast_api/app/bootstrap_admin.py
    back_fast_api/app/cli.py
    */__pycache__/*

[coverage:report]
show_missing = True
fail_under = 60

