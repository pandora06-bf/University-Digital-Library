services:
  db:
    image: postgres:15-alpine
    container_name: libmanager_db
    environment:
      POSTGRES_USER: lib_user
      POSTGRES_PASSWORD: lib_password
      POSTGRES_DB: libmanager_db
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data_nhat:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lib_user -d libmanager_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./back_fast_api
    container_name: libmanager_api
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://lib_user:lib_password@db:5432/libmanager_db}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: lib_user
      DB_PASSWORD: lib_password
      DB_NAME: libmanager_db
      WATCHFILES_FORCE_POLLING: "true"
      FRONTEND_ORIGINS: http://localhost:${FRONTEND_PORT:-5174},http://127.0.0.1:${FRONTEND_PORT:-5174},http://localhost:5173,http://127.0.0.1:5173
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      RESET_ADMIN_PASSWORD: ${RESET_ADMIN_PASSWORD:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./back_fast_api:/app
      - ./mocks:/data/mocks:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  scheduler:
    build:
      context: ./back_fast_api
    command: ["python", "-m", "app.scheduler_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://lib_user:lib_password@db:5432/libmanager_db}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      TZ: Asia/Ho_Chi_Minh
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-false}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./back_fast_api:/app
    restart: unless-stopped

  web:
    build:
      context: ./libmanager-frontend
    container_name: libmanager_web_nhat
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8010}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./libmanager-frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data_nhat:
